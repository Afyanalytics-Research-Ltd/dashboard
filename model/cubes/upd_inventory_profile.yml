cubes:
  - name: upd_inventory_profile
    sql_table: "\"REPORTING\".\"UPD_INVENTORY_PROFILE\""
    data_source: default

    joins: []

    dimensions:
      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string

      - name: first_dispensed_at
        sql: "{CUBE}.\"FIRST_DISPENSED_AT\""
        type: time

      - name: last_dispensed_at
        sql: "{CUBE}.\"LAST_DISPENSED_AT\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:04:28.715580+00:00
      - name: total_dispensing_visits
        sql: '{CUBE}."TOTAL_DISPENSING_VISITS"'
        type: sum
      - name: total_drugs_dispensed
        sql: '{CUBE}."TOTAL_DRUGS_DISPENSED"'
        type: sum
      - name: lifetime_units_dispensed
        sql: '{CUBE}."LIFETIME_UNITS_DISPENSED"'
        type: sum
      - name: ever_had_antibiotic
        sql: '{CUBE}."EVER_HAD_ANTIBIOTIC"'
        type: sum
      - name: ever_had_antimalarial
        sql: '{CUBE}."EVER_HAD_ANTIMALARIAL"'
        type: sum
      - name: ever_had_arv
        sql: '{CUBE}."EVER_HAD_ARV"'
        type: sum
      - name: ever_had_chronic_drug
        sql: '{CUBE}."EVER_HAD_CHRONIC_DRUG"'
        type: sum
      - name: ever_had_opioid
        sql: '{CUBE}."EVER_HAD_OPIOID"'
        type: sum
      - name: ever_had_obstetric_drug
        sql: '{CUBE}."EVER_HAD_OBSTETRIC_DRUG"'
        type: sum
      - name: ever_had_reserve_antibiotic
        sql: '{CUBE}."EVER_HAD_RESERVE_ANTIBIOTIC"'
        type: sum
      - name: ever_had_other_drug
        sql: '{CUBE}."EVER_HAD_OTHER_DRUG"'
        type: sum
      - name: total_unclassified_drugs
        sql: '{CUBE}."TOTAL_UNCLASSIFIED_DRUGS"'
        type: sum
      - name: count
        type: count

      - name: lifetime_drug_cost
        sql: "{CUBE}.\"LIFETIME_DRUG_COST\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
