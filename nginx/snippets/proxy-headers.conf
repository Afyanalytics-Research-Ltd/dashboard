# Standard headers every proxied backend needs to see the real client and
# the original scheme. Required for Django's SECURE_PROXY_SSL_HEADER /
# request.is_secure(), and for any backend that builds absolute URLs from
# the incoming request (redirects, generated links, CSRF checks, etc.).
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
