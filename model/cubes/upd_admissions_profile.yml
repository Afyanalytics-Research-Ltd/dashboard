cubes:
  - name: upd_admissions_profile
    sql_table: "\"REPORTING\".\"UPD_ADMISSIONS_PROFILE\""
    data_source: default

    joins: []

    dimensions:
      - name: admission_type
        sql: "{CUBE}.\"ADMISSION_TYPE\""
        type: string

      - name: is_open_admission
        sql: "{CUBE}.\"IS_OPEN_ADMISSION\""
        type: boolean

      - name: payment_mode
        sql: "{CUBE}.\"PAYMENT_MODE\""
        type: string

      - name: sex
        sql: "{CUBE}.\"SEX\""
        type: string

      - name: admission_date
        sql: "{CUBE}.\"ADMISSION_DATE\""
        type: time

      - name: discharge_date
        sql: "{CUBE}.\"DISCHARGE_DATE\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:04:24.094305+00:00
      - name: age_at_admission
        sql: '{CUBE}."AGE_AT_ADMISSION"'
        type: sum
      - name: los_days
        sql: '{CUBE}."LOS_DAYS"'
        type: sum
        # No join to rpt_retention/fact_inpatient_admissions here: this cube has no
        # facility/source_schema column at all, so a patient_id join can't be
        # facility-normalized — and the same raw-PATIENT_ID collision problem proven
        # elsewhere in this warehouse (see JOIN_MAP.md Universe C) means an unnormalized
        # join would silently overcount (naive join already returns 23,163 matches
        # against fact_inpatient_admissions for only 23,048 rows here).
        drill_members: [admission_date, admission_type, payment_mode, sex]
      - name: is_readmission
        sql: '{CUBE}."IS_READMISSION"'
        type: sum
      - name: is_30day_readmission
        sql: '{CUBE}."IS_30DAY_READMISSION"'
        type: sum
      - name: count
        type: count
        drill_members: [admission_date, admission_type, payment_mode, sex]

      - name: admission_cost
        sql: "{CUBE}.\"ADMISSION_COST\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

