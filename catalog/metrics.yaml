# Metric Catalog — auto-generated by generate_metrics.py
#
# Re-generate any time your Cube schema changes:
#   python generate_metrics.py
#
# All cube/measure/dimension names are verified against /cubejs-api/v1/meta.

metrics:
- id: canonical_keys_count
  name: Count of Canonical Keys
  description: This metric measures the total count of canonical keys in the system. It can
    be used to analyze the distribution of different therapeutic classes and subclasses, as
    well as the strength and form of the canonical names. Example questions include 'How many
    canonical keys are there for each therapeutic class?' and 'What is the count of canonical
    keys by form type?'.
  cube_query:
    measures:
    - canonical_keys.count
    dimensions:
    - canonical_keys.canonical_name
    - canonical_keys.form_canonical
    - canonical_keys.inn_name
    - canonical_keys.strength_canonical
    - canonical_keys.therapeutic_class
    - canonical_keys.therapeutic_subclass
    timeDimensions: []
    filters: []
    limit: 500
- id: canonical_product_taxonomy_metrics
  name: Canonical Product Taxonomy Metrics
  description: This metric provides insights into the canonical product taxonomy, measuring
    match confidence, total product count, and facility duplication counts. Use this metric
    to analyze product categorization accuracy, identify discrepancies in product data across
    facilities, and assess the effectiveness of the taxonomy. Example questions include 'What
    is the match confidence for products in a specific category?' or 'How many duplicate products
    are reported by each facility?'
  cube_query:
    measures:
    - canonical_product_taxonomy.match_confidence
    - canonical_product_taxonomy.count
    - canonical_product_taxonomy.facility_dup_count
    dimensions:
    - canonical_product_taxonomy.canonical_name
    - canonical_product_taxonomy.facility
    - canonical_product_taxonomy.product_category
    - canonical_product_taxonomy.match_type
    - canonical_product_taxonomy.inn_map_status
    timeDimensions:
    - dimension: canonical_product_taxonomy.loaded_at
      granularity: month
    filters: []
    limit: 500
- id: doctor_note_terms_analysis
  name: Doctor Note Terms Analysis
  description: This metric analyzes various terms found in doctor notes, focusing on chronic
    conditions, pregnancy status, follow-up needs, negations, and noise in the data. Use this
    metric to understand the prevalence of specific conditions and statuses in patient notes,
    answering questions like 'How many notes indicate chronic conditions?' or 'What is the
    count of follow-up terms in the notes?'. Important filters include clinical syndrome and
    disease burden group.
  cube_query:
    measures:
    - dim_doctor_note_terms.is_chronic
    - dim_doctor_note_terms.is_pregnant
    - dim_doctor_note_terms.is_followup
    - dim_doctor_note_terms.is_negated
    - dim_doctor_note_terms.is_noise
    - dim_doctor_note_terms.count
    dimensions:
    - dim_doctor_note_terms.canonical_term
    - dim_doctor_note_terms.clinical_syndrome
    - dim_doctor_note_terms.disease_burden_group
    - dim_doctor_note_terms.raw_term
    - dim_doctor_note_terms.status
    timeDimensions: []
    filters: []
    limit: 500
- id: product_match_confidence_metrics
  name: Product Match Confidence Metrics
  description: This metric measures the confidence levels of product matches within the hospital
    system. It includes minimum and average match confidence scores, as well as counts of
    products and facilities. Use this metric to analyze product matching effectiveness, identify
    discrepancies, and improve inventory management. Example questions include 'What is the
    average match confidence for products?' and 'How many products are present in facilities?'
  cube_query:
    measures:
    - dim_product_canonical.min_match_confidence
    - dim_product_canonical.avg_match_confidence
    - dim_product_canonical.count
    - dim_product_canonical.facility_count
    - dim_product_canonical.local_product_id_count
    dimensions:
    - dim_product_canonical.canonical_name
    - dim_product_canonical.form_canonical
    - dim_product_canonical.inn_name
    - dim_product_canonical.present_in_facilities
    - dim_product_canonical.strength_canonical
    timeDimensions:
    - dimension: dim_product_canonical.dim_loaded_at
      granularity: month
    filters: []
    limit: 500
- id: facility_role_count
  name: Facility Role Count
  description: This metric measures the total count of facility roles mapped within the hospital
    system. It can be used to analyze the distribution of roles across different facilities.
    Example questions include 'How many roles are assigned to each facility?' and 'What is
    the total number of roles available in the system?'.
  cube_query:
    measures:
    - facility_role_map.count
    dimensions:
    - facility_role_map.facility_code
    - facility_role_map.role_name
    timeDimensions: []
    filters: []
    limit: 500
- id: dispensing_quantity_metrics
  name: Dispensing Quantity Metrics
  description: This metric measures various aspects of medication dispensing, including the
    total quantity dispensed, payment status, and stock levels before and after dispensing.
    Use this metric to analyze dispensing trends, assess stock management, and evaluate financial
    performance. Example questions include 'What was the total quantity dispensed last month?'
    and 'How many items were invoiced during a specific period?'
  cube_query:
    measures:
    - fact_dispensing.quantity_dispensed
    - fact_dispensing.payment_status
    - fact_dispensing.is_invoiced
    - fact_dispensing.soh_before
    - fact_dispensing.soh_after_raw
    - fact_dispensing.soh_after_display
    - fact_dispensing.dispensing_year
    - fact_dispensing.dispensing_month_num
    - fact_dispensing.count
    - fact_dispensing.discount
    - fact_dispensing.dispensing_event_total
    - fact_dispensing.line_total
    - fact_dispensing.unit_price
    dimensions:
    - fact_dispensing.dispensed_from_negative_stock
    - fact_dispensing.is_stockout_dispense
    - fact_dispensing.product_id
    - fact_dispensing.sk_detail_id
    - fact_dispensing.sk_patient_id
    - fact_dispensing.sk_visit_id
    - fact_dispensing.source_schema
    - fact_dispensing.dispensed_at
    - fact_dispensing.dispensing_month
    timeDimensions:
    - dimension: fact_dispensing.dispensing_month
      granularity: month
    filters: []
    limit: 500
- id: inpatient_admissions_metrics
  name: Inpatient Admissions Metrics
  description: This metric provides insights into inpatient admissions, including total length
    of stay, readmission rates, and patient demographics such as age and sex. Use this metric
    to analyze trends in hospital admissions, assess patient outcomes, and identify potential
    areas for improvement in care. Example questions include 'What is the average age of patients
    admitted?' and 'How many patients were readmitted within 30 days?'
  cube_query:
    measures:
    - fact_inpatient_admissions.age
    - fact_inpatient_admissions.total_los_days
    - fact_inpatient_admissions.total_readmissions
    - fact_inpatient_admissions.total_30d_readmissions
