cubes:
  - name: rpt_bed_occupancy
    sql_table: "\"REPORTING\".\"RPT_BED_OCCUPANCY\""
    data_source: default

    # rpt_ward_los is unique at facility+ward_category+admission_month grain
    # (verified via direct SQL join-count check: 720/730 rpt_bed_occupancy
    # rows matched, no fan-out) — see Universe D in the join map.
    joins:
      - name: rpt_ward_los
        sql: "{CUBE}.\"FACILITY\" = {rpt_ward_los}.\"FACILITY\" AND {CUBE}.\"WARD_CATEGORY\" = {rpt_ward_los}.\"WARD_CATEGORY\" AND {CUBE}.\"ADMISSION_MONTH\" = {rpt_ward_los}.\"ADMISSION_MONTH\""
        relationship: many_to_one

    dimensions:
      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string
        primary_key: true

      - name: ward_age_group
        sql: "{CUBE}.\"WARD_AGE_GROUP\""
        type: string
        primary_key: true

      - name: ward_category
        sql: "{CUBE}.\"WARD_CATEGORY\""
        type: string
        primary_key: true

      - name: ward_name
        sql: "{CUBE}.\"WARD_NAME\""
        type: string
        primary_key: true

      - name: admission_month
        sql: "{CUBE}.\"ADMISSION_MONTH\""
        type: time
        primary_key: true

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T12:59:29.491767+00:00
      - name: open_admissions
        sql: '{CUBE}."OPEN_ADMISSIONS"'
        type: sum
      - name: insured_admissions
        sql: '{CUBE}."INSURED_ADMISSIONS"'
        type: sum
      - name: cash_admissions
        sql: '{CUBE}."CASH_ADMISSIONS"'
        type: sum
      - name: avg_los_days
        sql: '{CUBE}."AVG_LOS_DAYS"'
        type: avg
        title: Average Length of Stay (days)
        description: Average length of stay in days across admissions, per facility per month — use for "average LOS" / "length of stay" trend questions (e.g. is average LOS increasing or decreasing).
      - name: total_admission_revenue
        sql: '{CUBE}."TOTAL_ADMISSION_REVENUE"'
        type: sum
      - name: insured_revenue
        sql: '{CUBE}."INSURED_REVENUE"'
        type: sum
      - name: cash_revenue
        sql: '{CUBE}."CASH_REVENUE"'
        type: sum
      # Added via Semantic Layer Configuration settings page on 2026-08-05T11:20:54.370174+00:00
      # Requested by: ksh
      - name: bor_pct
        sql: '{total_bed_days} / NULLIF({bed_count} * {days_in_month}, 0) * 100'
        type: number
        format: percent
        title: Bed Occupancy Rate (%)
        description: total_bed_days / (bed_count * days_in_month) * 100.
        drill_members: [admission_month, facility, ward_category, ward_name]
      # Added via Semantic Layer Configuration settings page on 2026-08-05T11:20:46.889623+00:00
      # Requested by: ksh
      - name: bti_days
        sql: ({bed_count} * {days_in_month} - {total_bed_days}) / NULLIF({discharged_admissions}, 0)
        type: number
        title: Bed Turnover Interval (days)
        description: Average empty days between admissions = (bed_count * days_in_month - total_bed_days) / discharged_admissions.
      # Added via Semantic Layer Configuration settings page on 2026-08-05T11:20:38.277045+00:00
      # Requested by: ksh
      - name: btr
        sql: '{total_admissions} / NULLIF({bed_count}, 0)'
        type: number
        title: Bed Turnover Rate
        description: Admissions per available bed per month which is calculated as follows total_admissions / bed_count.
      # Added via Semantic Layer Configuration settings page on 2026-08-05T11:13:02.916486+00:00
      # Requested by: ksh
      - name: days_in_month
        sql: DAY(LAST_DAY({CUBE}."ADMISSION_MONTH"))
        type: max
      # Added via Semantic Layer Configuration settings page on 2026-08-05T10:57:41.313237+00:00
      # Requested by: ksh
      - name: bed_count
        sql: CASE {CUBE}."WARD_NAME" WHEN 'General Female'    THEN 7 WHEN 'General Maternity' THEN 7 WHEN 'Pediatric General' THEN 6 WHEN 'General Male'      THEN 4 WHEN 'Private Male'      THEN 3 WHEN 'Private Female'    THEN 3 WHEN 'Private Maternity' THEN 2 ELSE NULL END
        type: max
      # Added via Semantic Layer Configuration settings page on 2026-08-05T10:57:05.782253+00:00
      # Requested by: ksh
      - name: total_bed_days
        sql: '{CUBE}."TOTAL_BED_DAYS"'
        type: sum
      # Added via Semantic Layer Configuration settings page on 2026-08-05T10:56:01.069816+00:00
      # Requested by: ksh
      - name: discharged_admissions
        sql: '{CUBE}."DISCHARGED_ADMISSIONS"'
        type: sum
      # Added via Semantic Layer Configuration settings page on 2026-08-05T10:54:28.370457+00:00
      # Requested by: ksh
      - name: total_admissions
        sql: '{CUBE}."TOTAL_ADMISSIONS"'
        type: sum
      - name: count
        type: count
        drill_members: [admission_month, facility, ward_category, ward_name]

      - name: avg_admission_cost
        sql: "{CUBE}.\"AVG_ADMISSION_COST\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

