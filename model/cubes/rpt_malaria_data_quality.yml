cubes:
  - name: rpt_malaria_data_quality
    sql_table: "\"REPORTING\".\"RPT_MALARIA_DATA_QUALITY\""
    data_source: default

    joins:
      - name: rpt_malaria_zones
        sql: "{CUBE}.\"ZONE_LABEL\" = {rpt_malaria_zones}.\"ZONE_LABEL\""
        relationship: many_to_one

    dimensions:
      - name: comparison_allowed
        sql: "{CUBE}.\"COMPARISON_ALLOWED\""
        type: boolean

      - name: confidence_level
        sql: "{CUBE}.\"CONFIDENCE_LEVEL\""
        type: string

      - name: evidence_type
        sql: "{CUBE}.\"EVIDENCE_TYPE\""
        type: string

      - name: known_gap
        sql: "{CUBE}.\"KNOWN_GAP\""
        type: string

      - name: metric_id
        sql: "{CUBE}.\"METRIC_ID\""
        type: string
        primary_key: true

      - name: metric_name
        sql: "{CUBE}.\"METRIC_NAME\""
        type: string

      - name: reliability_note
        sql: "{CUBE}.\"RELIABILITY_NOTE\""
        type: string

      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string

      - name: what_data_would_unlock
        sql: "{CUBE}.\"WHAT_DATA_WOULD_UNLOCK\""
        type: string

      - name: zone_label
        sql: "{CUBE}.\"ZONE_LABEL\""
        type: string
        primary_key: true

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:01:12.700791+00:00
      - name: completeness_pct
        sql: '{CUBE}."COMPLETENESS_PCT"'
        type: avg
        drill_members: [zone_label, metric_name, confidence_level]
      - name: count
        type: count
        drill_members: [zone_label, metric_name, evidence_type, source_schema]

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

