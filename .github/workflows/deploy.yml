# Deploy to production (44.215.230.30) on every push to main — i.e. when a PR
# is merged. Can also be run by hand from the Actions tab ("Run workflow"),
# optionally forcing a web rebuild.
#
# The actual work is scripts/deploy.sh, run ON the server. It is started
# detached (nohup) because builds on the t2.large take a long time and an SSH
# drop would otherwise kill them; this job just streams its log and fails if
# the deploy or the final health check fails.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   PROD_SSH_KEY      private key allowed to SSH in as PROD_USER (a dedicated deploy key)
#   PROD_HOST         44.215.230.30
#   PROD_USER         ubuntu
#   PROD_KNOWN_HOSTS  the server's host key line(s), from `ssh-keyscan 44.215.230.30`
# The EC2 security group must allow SSH (22) from GitHub's runners.
name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild web even if no web files changed"
        type: boolean
        default: false

# never two deploys at once; a newer merge waits for the running one
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host prod
            HostName ${{ secrets.PROD_HOST }}
            User ${{ secrets.PROD_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 30
          EOF
          ssh prod 'echo "connected to $(hostname)"'

      - name: Start deploy on the server
        env:
          FULL: ${{ inputs.full && '1' || '0' }}
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Run the deploy script from the commit being deployed (not the
          # server's older checkout), detached, writing its exit code at the end.
          # setsid -f: own session, so closing this SSH connection can't touch it.
          ssh -n prod "set -e; mkdir -p ~/deploy-logs; cd ~/dashboard
                    git fetch -q origin main
                    git show ${GITHUB_SHA}:scripts/deploy.sh > ~/deploy-logs/deploy-$RUN.sh
                    chmod +x ~/deploy-logs/deploy-$RUN.sh
                    setsid -f bash -c 'FULL=$FULL ~/deploy-logs/deploy-$RUN.sh; echo \$? > ~/deploy-logs/$RUN.exit' \
                      > ~/deploy-logs/$RUN.log 2>&1 < /dev/null
                    echo started"

      - name: Follow deploy log
        env:
          RUN: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Each poll prints the complete log lines added since the last one,
          # then "@@<lines> <exit code or ->".
          shown=0
          for i in $(seq 1 420); do            # up to 70 min, every 10 s
            # exit code read BEFORE counting lines, so a finished run's last lines are never missed
            out=$(ssh -n prod "e=\$(cat ~/deploy-logs/$RUN.exit 2>/dev/null || echo -); f=~/deploy-logs/$RUN.log
                               t=\$(wc -l < \$f 2>/dev/null || echo 0)
                               [ \$t -gt $shown ] && sed -n \"$((shown + 1)),\${t}p\" \$f
                               echo \"@@\$t \$e\"" || true)
            meta=$(printf '%s\n' "$out" | tail -n 1)
            printf '%s\n' "$out" | sed '$d' | grep -v '^$' || true
            case "$meta" in
              @@*) shown=$(echo "$meta" | cut -d' ' -f1 | tr -d @); code=$(echo "$meta" | cut -d' ' -f2) ;;
              *)   code=- ;;                    # SSH hiccup: try again next round
            esac
            if [ "$code" != - ]; then
              echo "deploy exited with $code"
              [ "$code" = 0 ] && exit 0
              [ "$code" = 75 ] && echo "::error::another deploy was already running on the server"
              exit 1
            fi
            sleep 10
          done
          echo "::error::deploy still running after 70 min — check ~/deploy-logs/$RUN.log on the server"
          exit 1
