cubes:
  - name: vw_rpt_ortho_physician_dependence
    sql_table: "\"REPORTING\".\"VW_RPT_ORTHO_PHYSICIAN_DEPENDENCE\""
    data_source: default

    joins:
      - name: vw_rpt_ortho_patient_journey
        sql: "{CUBE}.\"VISIT_ID\" = {vw_rpt_ortho_patient_journey}.\"VISIT_ID\""
        relationship: many_to_one

      - name: vw_rpt_ortho_admissions
        sql: "{CUBE}.\"VISIT_ID\" = {vw_rpt_ortho_admissions}.\"VISIT_ID\""
        relationship: one_to_one

    dimensions:
      - name: admitted_by_hash
        sql: "{CUBE}.\"ADMITTED_BY_HASH\""
        type: string

      - name: bed_category
        sql: "{CUBE}.\"BED_CATEGORY\""
        type: string

      - name: composite_patient_id
        sql: "{CUBE}.\"COMPOSITE_PATIENT_ID\""
        type: string

      - name: discharge_category
        sql: "{CUBE}.\"DISCHARGE_CATEGORY\""
        type: string

      - name: doctor_hash
        sql: "{CUBE}.\"DOCTOR_HASH\""
        type: string

      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: gender
        sql: "{CUBE}.\"GENDER\""
        type: string

      - name: is_discharge_reliable
        sql: "{CUBE}.\"IS_DISCHARGE_RELIABLE\""
        type: boolean

      - name: link_confidence
        sql: "{CUBE}.\"LINK_CONFIDENCE\""
        type: string

      - name: patient_id
        sql: "{CUBE}.\"PATIENT_ID\""
        type: string

      - name: pay_mode
        sql: "{CUBE}.\"PAY_MODE\""
        type: string

      - name: source_system
        sql: "{CUBE}.\"SOURCE_SYSTEM\""
        type: string

      - name: v1_physician_id
        sql: "{CUBE}.\"V1_PHYSICIAN_ID\""
        type: string

      - name: v1_physician_is_proxy
        sql: "{CUBE}.\"V1_PHYSICIAN_IS_PROXY\""
        type: boolean

      - name: visit_id
        sql: "{CUBE}.\"VISIT_ID\""
        type: string
        primary_key: true

      - name: ward
        sql: "{CUBE}.\"WARD\""
        type: string

      - name: admission_date
        sql: "{CUBE}.\"ADMISSION_DATE\""
        type: time

      - name: admission_month
        sql: "{CUBE}.\"ADMISSION_MONTH\""
        type: time

      - name: admission_week
        sql: "{CUBE}.\"ADMISSION_WEEK\""
        type: time

      - name: discharge_date
        sql: "{CUBE}.\"DISCHARGE_DATE\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:05:16.504198+00:00
      - name: admission_year
        sql: '{CUBE}."ADMISSION_YEAR"'
        type: sum
      - name: los_days
        sql: '{CUBE}."LOS_DAYS"'
        type: sum
        drill_members: [admission_date, facility, doctor_hash, ward, visit_id]
      - name: count
        type: count
        drill_members: [admission_date, facility, doctor_hash, ward, visit_id]

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

