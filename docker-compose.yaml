version: "3"

x-airflow-common:
  &airflow-common
  image: apache/airflow:3.3.0
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
  user: "50000:0"
  depends_on:
    &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

x-redash-common:
  &redash-common
  image: redash/redash:10.1.0.b50633
  environment:
    &redash-common-env
    REDASH_LOG_LEVEL: "INFO"
    REDASH_REDIS_URL: redis://redash-redis:6379/0
    REDASH_DATABASE_URL: postgresql://${REDASH_DB_USER}:${REDASH_DB_PASSWORD}@redash-postgres/${REDASH_DB_NAME}
    REDASH_COOKIE_SECRET: ${REDASH_COOKIE_SECRET}
    REDASH_SECRET_KEY: ${REDASH_SECRET_KEY}
  depends_on:
    &redash-common-depends-on
    redash-postgres:
      condition: service_started
    redash-redis:
      condition: service_started

services:



  web:
    restart: always
    build: .
    expose:
      - "8000"
    links:
      - redis:redis
    volumes:
      - web-django:/usr/src/app
      - web-static:/usr/src/app/static
    env_file: .env  
    entrypoint: ["/bin/bash", "+x", "/entrypoint.sh"]
  

  streamlit:
    restart: always
    build: .
    container_name: streamlit-container
    expose:
      - "8501"
    ports:
      - "8501:8501"
    volumes:
      - ./:/usr/src/app
    env_file: .env
    working_dir: /usr/src/app
    depends_on:
      - postgres
      - redis
    command: >
      streamlit run analytics_app/dashboards/dynamic_file_loader.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
      --server.enableCORS=false
      --server.enableXsrfProtection=false
      --server.baseUrlPath=/streamlitdashboard

  postgres:
    image: postgres:latest
    container_name: postgres-container
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DBNAME}
    volumes:
      - /opt/postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"

  nginx:
    restart: always
    build: ./nginx/
    ports:
      - "80:80"
      - "443:443" # Added to expose port 443 for SSL
    volumes:
      - web-static:/www/static
      - letsencrypt:/etc/letsencrypt # Mount LetsEncrypt certificates
    links:
      - web:web
    # command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"] # Renew SSL certificates every 6 hours

  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
      - web-static:/static/
    command: certonly --non-interactive --agree-tos --nginx -m "lutherlunyamwi@gmail.com" -d "datahub.afya.ai"

  redis:
    restart: always
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  cube:
    restart: always
    image: cubejs/cube
    container_name: cube-container
    ports:
      - "4000:4000"
      - "15432:15432"
    volumes:
      - ./:/cube/conf
      - ./rsa_key.p8:/cube/conf/rsa_key.p8:ro
    env_file: .env

  marquez-db:
    restart: always
    image: postgres:14
    container_name: marquez-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${MARQUEZ_DB_USER}
      POSTGRES_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      POSTGRES_DB: ${MARQUEZ_DB_NAME}
    volumes:
      - marquez-pg-data:/var/lib/postgresql/data

  marquez:
    restart: always
    image: marquezproject/marquez
    container_name: marquez-api
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ./marquez/marquez.yml:/usr/src/app/marquez.yml
    environment:
      MARQUEZ_CONFIG: /usr/src/app/marquez.yml
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      MARQUEZ_USER: ${MARQUEZ_DB_USER}
      MARQUEZ_PASSWORD: ${MARQUEZ_DB_PASSWORD}
      MARQUEZ_DB: ${MARQUEZ_DB_NAME}
      SEARCH_ENABLED: "false"
    depends_on:
      - marquez-db

  marquez-web:
    restart: always
    image: marquezproject/marquez-web
    container_name: marquez-web
    ports:
      - "3000:3000"
    environment:
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    depends_on:
      - marquez

  airflow-db:
    restart: always
    image: postgres:16
    container_name: airflow-db
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 10s
      retries: 5
      start_period: 5s

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD}
    user: "0:0"
    depends_on:
      *airflow-common-depends-on

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  kafka:
    restart: always
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

  kafka-ui:
    restart: always
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: "8090"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  redash-postgres:
    restart: always
    image: postgres:16
    container_name: redash-postgres
    environment:
      POSTGRES_USER: ${REDASH_DB_USER}
      POSTGRES_PASSWORD: ${REDASH_DB_PASSWORD}
      POSTGRES_DB: ${REDASH_DB_NAME}
    volumes:
      - redash-pg-data:/var/lib/postgresql/data

  redash-redis:
    restart: always
    image: redis:latest
    container_name: redash-redis

  redash-server:
    <<: *redash-common
    container_name: redash-server
    command: server
    restart: always
    ports:
      - "5050:5000"
    environment:
      <<: *redash-common-env
      REDASH_WEB_WORKERS: 4

  redash-scheduler:
    <<: *redash-common
    container_name: redash-scheduler
    command: scheduler
    restart: always

  redash-worker:
    <<: *redash-common
    container_name: redash-worker
    command: worker
    restart: always



volumes:
  web-django:
  web-static:
  redisdata:
  letsencrypt:
  marquez-pg-data:
  airflow-pg-data:
  redash-pg-data: