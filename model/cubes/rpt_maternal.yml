cubes:
  - name: rpt_maternal
    sql_table: "\"REPORTING\".\"RPT_MATERNAL\""
    data_source: default

    joins: []

    dimensions:
      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string

      - name: maternal_case_type
        sql: "{CUBE}.\"MATERNAL_CASE_TYPE\""
        type: string
        description: 'e.g. "ANC", "COMPLICATION / HIGH RISK", "PREGNANCY LOSS", "DELIVERY".'

      - name: clean_diagnosis
        sql: "{CUBE}.\"CLEAN_DIAGNOSIS\""
        type: string

      - name: final_disease_burden_group
        sql: "{CUBE}.\"FINAL_DISEASE_BURDEN_GROUP\""
        type: string

      - name: age_group
        sql: "{CUBE}.\"AGE_GROUP\""
        type: string

      - name: gender
        sql: "{CUBE}.\"GENDER\""
        type: string

      - name: payment_mode
        sql: "{CUBE}.\"PAYMENT_MODE\""
        type: string

      - name: is_comorbidity
        sql: "{CUBE}.\"IS_COMORBIDITY\""
        type: boolean

      - name: comorbidity_pair
        sql: "{CUBE}.\"COMORBIDITY_PAIR\""
        type: string

      - name: has_chronic_diagnosis
        sql: "{CUBE}.\"HAS_CHRONIC_DIAGNOSIS\""
        type: boolean

      - name: anc_adherence_band
        sql: "{CUBE}.\"ANC_ADHERENCE_BAND\""
        type: string
        description: 'ANC visit-count adherence band per patient''s 9-month pregnancy window, e.g. "Single Visit (Lost)" — Kenya MoH target is 8+ visits.'

      - name: visit_month
        sql: "{CUBE}.\"VISIT_MONTH\""
        type: time

    measures:
      - name: total_visits
        sql: '{CUBE}."TOTAL_VISITS"'
        type: sum
        title: Maternal Visits (count)
        description: Total maternal visit count — break down by maternal_case_type (ANC/COMPLICATION/PREGNANCY LOSS), age_group, or visit_month.

      - name: distinct_patients
        sql: '{CUBE}."DISTINCT_PATIENTS"'
        type: sum
        title: Distinct Maternal Patients (count)

      - name: visits_with_comorbidity
        sql: '{CUBE}."VISITS_WITH_COMORBIDITY"'
        type: sum
        title: Maternal Visits With Comorbidity (count)

      - name: single_visit_patients
        sql: '{CUBE}."DISTINCT_PATIENTS"'
        type: sum
        filters:
          - sql: "{CUBE}.\"ANC_ADHERENCE_BAND\" = 'Single Visit (Lost)'"
        title: Single-Visit ANC Patients (count)

      - name: single_visit_pct
        sql: "{single_visit_patients} * 100.0 / NULLIF({distinct_patients}, 0)"
        type: number
        format: percent
        title: Single-Visit ANC Rate (%)
        description: Percentage of ANC patients who are single-visit (lost after first contact) — single_visit_patients / distinct_patients. Filter maternal_case_type = 'ANC' first.

      - name: total_investigations
        sql: '{CUBE}."TOTAL_INVESTIGATIONS"'
        type: sum
        title: Maternal Investigations Ordered (count)

      - name: total_investigation_revenue
        sql: '{CUBE}."TOTAL_INVESTIGATION_REVENUE"'
        type: sum
        format: currency
        title: Maternal Investigation Revenue (KES)

      - name: total_prescriptions
        sql: '{CUBE}."TOTAL_PRESCRIPTIONS"'
        type: sum
        title: Maternal Prescriptions (count)

      - name: total_prescription_revenue
        sql: '{CUBE}."TOTAL_PRESCRIPTION_REVENUE"'
        type: sum
        format: currency
        title: Maternal Prescription Revenue (KES)
        description: Total prescription revenue generated by maternal visits.

      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
