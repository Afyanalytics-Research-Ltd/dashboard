cubes:
  - name: rpt_case_mix
    sql_table: "\"REPORTING\".\"RPT_CASE_MIX\""
    data_source: default

    joins: []

    dimensions:
      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string

      - name: final_disease_burden_group
        sql: "{CUBE}.\"FINAL_DISEASE_BURDEN_GROUP\""
        type: string

      - name: clean_diagnosis
        sql: "{CUBE}.\"CLEAN_DIAGNOSIS\""
        type: string

      - name: classification_source
        sql: "{CUBE}.\"CLASSIFICATION_SOURCE\""
        type: string
        description: How this visit's diagnosis was classified — e.g. "Doctor Note - Mapped" for note-derived (no ICD-10 code) classification.

      - name: visit_type
        sql: "{CUBE}.\"VISIT_TYPE\""
        type: string
        description: Inpatient vs outpatient visit type.

      - name: age_group
        sql: "{CUBE}.\"AGE_GROUP\""
        type: string

      - name: gender
        sql: "{CUBE}.\"GENDER\""
        type: string

      - name: payment_mode
        sql: "{CUBE}.\"PAYMENT_MODE\""
        type: string

      - name: is_comorbidity
        sql: "{CUBE}.\"IS_COMORBIDITY\""
        type: boolean

      - name: has_comorbidity
        sql: "{CUBE}.\"HAS_COMORBIDITY\""
        type: boolean

      - name: comorbidity_pair
        sql: "{CUBE}.\"COMORBIDITY_PAIR\""
        type: string

      - name: is_chronic
        sql: "{CUBE}.\"IS_CHRONIC\""
        type: number

      - name: has_chronic_diagnosis
        sql: "{CUBE}.\"HAS_CHRONIC_DIAGNOSIS\""
        type: boolean

      - name: visit_month
        sql: "{CUBE}.\"VISIT_MONTH\""
        type: time

    measures:
      - name: total_visits
        sql: '{CUBE}."TOTAL_VISITS"'
        type: sum
        title: Visits (count)
        description: Total visit count — use for "total visit count", "which diagnosis has the most visits", "which age group accounts for the most visits" questions, broken down by clean_diagnosis, final_disease_burden_group, age_group, payment_mode, visit_type, or comorbidity_pair.

      - name: distinct_patients
        sql: '{CUBE}."DISTINCT_PATIENTS"'
        type: sum
        title: Distinct Patients (count)

      - name: comorbid_visits
        sql: '{CUBE}."TOTAL_VISITS"'
        type: sum
        filters:
          - sql: "{CUBE}.\"HAS_COMORBIDITY\" = TRUE"
        title: Comorbid Visits (count)

      - name: comorbidity_rate_pct
        sql: "{comorbid_visits} * 100.0 / NULLIF({total_visits}, 0)"
        type: number
        format: percent
        title: Comorbidity Rate (%)
        description: Percentage of visits with a comorbidity recorded — comorbid_visits / total_visits. Break down by visit_type for "do inpatient visits have a higher comorbidity rate than outpatient" questions.

      - name: doctor_note_only_visits
        sql: '{CUBE}."TOTAL_VISITS"'
        type: sum
        filters:
          - sql: "{CUBE}.\"CLASSIFICATION_SOURCE\" = 'Doctor Note - Mapped'"
        title: Doctor-Note-Only Classified Visits (count)

      - name: doctor_note_only_pct
        sql: "{doctor_note_only_visits} * 100.0 / NULLIF({total_visits}, 0)"
        type: number
        format: percent
        title: Doctor-Note-Only Classification Rate (%)
        description: Percentage of visits with no ICD-10 code, classified solely from doctor notes — doctor_note_only_visits / total_visits.

      - name: unclassified_visits
        sql: '{CUBE}."TOTAL_VISITS"'
        type: sum
        filters:
          - sql: "{CUBE}.\"FINAL_DISEASE_BURDEN_GROUP\" = 'Unclassified'"
        title: Unclassified Visits (count)

      - name: unclassified_pct
        sql: "{unclassified_visits} * 100.0 / NULLIF({total_visits}, 0)"
        type: number
        format: percent
        title: Unclassified Visit Rate (%)
        description: Percentage of visits with an unclassified disease burden group — unclassified_visits / total_visits.

      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started
