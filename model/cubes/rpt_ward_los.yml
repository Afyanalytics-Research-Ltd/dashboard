cubes:
  - name: rpt_ward_los
    sql_table: "\"REPORTING\".\"RPT_WARD_LOS\""
    data_source: default

    joins: []

    dimensions:
      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: ward_category
        sql: "{CUBE}.\"WARD_CATEGORY\""
        type: string

      - name: admission_month
        sql: "{CUBE}.\"ADMISSION_MONTH\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:04:12.517158+00:00
      - name: median_los_days
        sql: '{CUBE}."MEDIAN_LOS_DAYS"'
        type: sum
      - name: admissions
        sql: '{CUBE}."ADMISSIONS"'
        type: sum
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

