# Metric Catalog — auto-generated by generate_metrics.py
#
# Re-generate any time your Cube schema changes:
#   python generate_metrics.py
#
# All cube/measure/dimension names are verified against /cubejs-api/v1/meta.

metrics:
- id: canonical_keys_count
  name: Count of Canonical Keys
  description: This metric measures the total count of canonical keys in the system. It can
    be used to analyze the distribution of different therapeutic classes and subclasses, as
    well as the strength and form of the canonical names. Example questions include 'How many
    canonical keys are there for each therapeutic class?' and 'What is the count of canonical
    keys by form type?'.
  cube_query:
    measures:
    - canonical_keys.count
    dimensions:
    - canonical_keys.canonical_name
    - canonical_keys.form_canonical
    - canonical_keys.inn_name
    - canonical_keys.strength_canonical
    - canonical_keys.therapeutic_class
    - canonical_keys.therapeutic_subclass
    timeDimensions: []
    filters: []
    limit: 500
- id: canonical_product_taxonomy_count_metrics
  name: Canonical Product Taxonomy Count Metrics
  description: This metric measures the total count of canonical products and the count of
    duplicate facilities associated with them. Use this metric to analyze product taxonomy
    data, identify trends in product categorization, and assess the integrity of facility
    data. Example questions include 'How many unique canonical products are there?' and 'What
    is the count of duplicate facilities for these products?'
  cube_query:
    measures:
    - canonical_product_taxonomy.count
    - canonical_product_taxonomy.facility_dup_count
    dimensions:
    - canonical_product_taxonomy.canonical_name
    - canonical_product_taxonomy.facility
    - canonical_product_taxonomy.product_category
    - canonical_product_taxonomy.product_name
    - canonical_product_taxonomy.inn_map_status
    timeDimensions:
    - dimension: canonical_product_taxonomy.loaded_at
      granularity: month
    filters: []
    limit: 500
- id: doctor_note_terms_count
  name: Count of Doctor Note Terms
  description: This metric measures the total count of doctor note terms recorded in the system.
    It can be used to analyze trends in clinical documentation, assess the usage of specific
    terms, and evaluate the status of clinical syndromes and disease burden groups. Example
    questions include 'How many doctor note terms were recorded last month?' and 'What is
    the distribution of terms by status?'
  cube_query:
    measures:
    - dim_doctor_note_terms.count
    dimensions:
    - dim_doctor_note_terms.canonical_term
    - dim_doctor_note_terms.clinical_syndrome
    - dim_doctor_note_terms.disease_burden_group
    - dim_doctor_note_terms.raw_term
    - dim_doctor_note_terms.status
    timeDimensions: []
    filters: []
    limit: 500
- id: fact_dispensing_metrics
  name: Dispensing Metrics Overview
  description: This metric provides insights into the dispensing activities within the hospital,
    including total counts, discounts applied, and line totals. Use this metric to analyze
    dispensing trends, identify stockout events, and evaluate financial impacts. Example questions
    include 'What is the total number of dispenses this month?' and 'How much discount was
    given on dispenses last quarter?'
  cube_query:
    measures:
    - fact_dispensing.count
    - fact_dispensing.discount
    - fact_dispensing.dispensing_event_total
    - fact_dispensing.line_total
    - fact_dispensing.unit_price
    dimensions:
    - fact_dispensing.dispensed_from_negative_stock
    - fact_dispensing.is_stockout_dispense
    - fact_dispensing.source_schema
    - fact_dispensing.sk_patient_id
    - fact_dispensing.sk_visit_id
    timeDimensions:
    - dimension: fact_dispensing.dispensing_month
      granularity: month
    filters: []
    limit: 500
- id: inpatient_admissions_metrics
  name: Inpatient Admissions Metrics
  description: This metric tracks the total number of inpatient admissions and the total visits
    count within the hospital system. Use this metric to analyze patient admission trends,
    evaluate the effectiveness of care, and understand patient demographics based on sex and
    source of admission. Example questions include 'How many inpatient admissions were there
    last month?' and 'What is the total visit count for male patients?'
  cube_query:
    measures:
    - fact_inpatient_admissions.count
    - fact_inpatient_admissions.total_visits_count
    dimensions:
    - fact_inpatient_admissions.sex
    - fact_inpatient_admissions.source_schema
    timeDimensions: []
    filters: []
    limit: 500
- id: patient_dispensing_metrics
  name: Patient Dispensing Metrics
  description: This metric tracks the dispensing of medications to patients, including the
    total number of drugs dispensed, the total cost of these drugs, and counts of unclassified
    drugs. Use this metric to analyze medication distribution trends over time, assess costs,
    and identify dispensing patterns. Example questions include 'How many drugs were dispensed
    last month?' or 'What was the total drug cost for patients in a specific facility?'
  cube_query:
    measures:
    - fact_patient_dispensing.count
    - fact_patient_dispensing.drugs_dispensed_count
    - fact_patient_dispensing.total_drug_cost
    - fact_patient_dispensing.unclassified_drug_count
    dimensions:
    - fact_patient_dispensing.source_schema
    timeDimensions:
    - dimension: fact_patient_dispensing.dispensing_month
      granularity: month
    filters: []
    limit: 500
- id: patient_finance_event_metrics
  name: Patient Finance Event Metrics
  description: This metric tracks the count and total amount of financial events related to
    patients, such as payments and invoices. Use it to analyze financial performance, understand
    payment trends, and assess the impact of different payment modes. Example questions include
    'How many financial events occurred last month?' and 'What was the total amount collected
    from patient invoices this quarter?'
  cube_query:
    measures:
    - fact_patient_finance_events.count
    - fact_patient_finance_events.amount
    dimensions:
    - fact_patient_finance_events.event_type
    - fact_patient_finance_events.invoice_no
    - fact_patient_finance_events.patient_id
    - fact_patient_finance_events.payment_mode
    - fact_patient_finance_events.source_schema
    - fact_patient_finance_events.source_table
    timeDimensions:
    - dimension: fact_patient_finance_events.event_date
      granularity: month
    filters: []
    limit: 500
- id: patient_invoice_counts
  name: Patient Invoice Counts
  description: This metric measures the total number of patient invoices and the count of
    events associated with those invoices. It can be used to analyze billing activity over
    time, identify trends in patient invoicing, and assess the volume of services rendered.
    Useful questions include 'How many invoices were generated last month?' or 'What is the
    event count for invoices in a specific facility?'
  cube_query:
    measures:
    - fact_patient_invoice.count
    - fact_patient_invoice.event_count
    dimensions:
    - fact_patient_invoice.facility_key
    - fact_patient_invoice.patient_id
    timeDimensions:
    - dimension: fact_patient_invoice.first_event_date
      granularity: month
    filters: []
    limit: 500
- id: ar_aging_count_by_facility_and_bucket
  name: Accounts Receivable Aging Count
  description: This metric measures the count of accounts receivable aging records, categorized
    by aging bucket and facility. Use this metric to analyze the distribution of outstanding
    receivables over time, helping to identify trends in collections and outstanding balances.
    Example questions include 'How many accounts are overdue by 30 days at each facility?'
    and 'What is the count of receivables in each aging bucket for the last invoice month?'
  cube_query:
    measures:
    - rpt_ar_aging.count
    dimensions:
    - rpt_ar_aging.aging_bucket
    - rpt_ar_aging.facility
    - rpt_ar_aging.insurer
    timeDimensions:
    - dimension: rpt_ar_aging.invoice_month
      granularity: month
    filters: []
    limit: 500
- id: bed_occupancy_metrics
  name: Bed Occupancy Metrics
  description: This metric measures the total count of bed occupancy and the average admission
    cost across different facilities and wards. Use this to analyze trends in bed usage and
    associated costs over time. Example questions include 'What is the average admission cost
    for the pediatric ward this month?' or 'How many beds were occupied in the main facility
    last month?'
  cube_query:
    measures:
    - rpt_bed_occupancy.count
    - rpt_bed_occupancy.avg_admission_cost
    dimensions:
    - rpt_bed_occupancy.facility
    - rpt_bed_occupancy.ward_age_group
    - rpt_bed_occupancy.ward_category
    - rpt_bed_occupancy.ward_name
    timeDimensions:
    - dimension: rpt_bed_occupancy.admission_month
      granularity: month
    filters: []
    limit: 500
- id: dialysis_session_count
  name: Dialysis Session Count
  description: This metric measures the total number of dialysis sessions conducted within
    a specified time frame. It can be used to analyze trends in dialysis treatment over time,
    assess resource allocation, and evaluate facility performance. Example questions include
    'How many dialysis sessions were held last month?' or 'What is the session count by facility
    for the past year?'
  cube_query:
    measures:
    - rpt_dialysis.count
    dimensions:
    - rpt_dialysis.dialysis_ward
    - rpt_dialysis.facility
    timeDimensions:
    - dimension: rpt_dialysis.session_month
      granularity: month
    filters: []
    limit: 500
- id: disease_burden_metrics
  name: Disease Burden Metrics
  description: This metric measures the total count of disease cases and the count of prescriptions
    related to those diseases across different facilities. Use this metric to analyze disease
    prevalence and treatment patterns over time. Example questions include 'What is the total
    disease burden for each facility this month?' and 'How many prescriptions were issued
    for each disease group last month?'
  cube_query:
    measures:
    - rpt_disease_burden.count
    - rpt_disease_burden.rx_count
    dimensions:
    - rpt_disease_burden.disease_group
    - rpt_disease_burden.facility
    - rpt_disease_burden.source_schema
    timeDimensions:
    - dimension: rpt_disease_burden.signal_month
      granularity: month
    filters: []
    limit: 500
- id: rpt_dispensing_trends_overview
  name: Dispensing Trends Overview
  description: This metric provides insights into the total number of dispensings and their
    associated values over time. It can be used to analyze trends in medication dispensing
    across different facilities and therapeutic classes. Example questions include 'What are
    the total dispensing values by facility this month?' or 'How many dispensings occurred
    for each therapeutic class last quarter?'
  cube_query:
    measures:
    - rpt_dispensing_trends.count
    - rpt_dispensing_trends.total_dispensing_value
    dimensions:
    - rpt_dispensing_trends.canonical_name
    - rpt_dispensing_trends.facility
    - rpt_dispensing_trends.inn_name
    - rpt_dispensing_trends.therapeutic_class
    - rpt_dispensing_trends.therapeutic_subclass
    timeDimensions:
    - dimension: rpt_dispensing_trends.dispensing_month
      granularity: month
    filters: []
    limit: 500
- id: rpt_dos_watchlist_count
  name: Count of Watchlist Items
  description: This metric measures the total count of items on the DOS watchlist, providing
    insights into inventory management and medication monitoring. Use it to answer questions
    about the number of items flagged for review, track trends over time, or assess the impact
    of reorder urgency. Important filters include facility and therapeutic class to narrow
    down specific areas of concern.
  cube_query:
    measures:
    - rpt_dos_watchlist.count
    dimensions:
    - rpt_dos_watchlist.canonical_name
    - rpt_dos_watchlist.facility
    - rpt_dos_watchlist.inn_name
    - rpt_dos_watchlist.product_name
    - rpt_dos_watchlist.reorder_urgency
    - rpt_dos_watchlist.therapeutic_class
    timeDimensions:
    - dimension: rpt_dos_watchlist.last_dispensed_at
      granularity: month
    filters: []
    limit: 500
- id: insurance_ar_count_by_facility
  name: Insurance Accounts Receivable Count by Facility
  description: This metric measures the total count of insurance accounts receivable, segmented
    by facility and insurer. It is useful for analyzing the volume of outstanding insurance
    claims over time. Example questions include 'How many insurance accounts receivable do
    we have for each facility this month?' and 'What is the trend in accounts receivable by
    insurer?'
  cube_query:
    measures:
    - rpt_insurance_ar.count
    dimensions:
    - rpt_insurance_ar.facility
    - rpt_insurance_ar.insurer
    timeDimensions:
    - dimension: rpt_insurance_ar.invoice_month
      granularity: month
    filters: []
    limit: 500
- id: kakamega_population_metrics
  name: Kakamega Population Metrics
  description: This metric tracks the total population and visit counts in the Kakamega region.
    Use it to analyze trends in population and healthcare visits over time, and to answer
    questions about facility performance and sub-county demographics. Important filters include
    facility and sub-county to refine your analysis.
  cube_query:
    measures:
    - rpt_kakamega_population.count
    - rpt_kakamega_population.visit_count
    dimensions:
    - rpt_kakamega_population.facility
    - rpt_kakamega_population.source_schema
    - rpt_kakamega_population.sub_county
    timeDimensions:
    - dimension: rpt_kakamega_population.visit_month
      granularity: month
    filters: []
    limit: 500
- id: ward_utilisation_metrics
  name: Ward Utilisation Metrics
  description: This metric measures the count and percentage of total utilisation for wards
    in the Lodwar facility. Use this to analyze how effectively wards are being utilized over
    time. Example questions include 'What is the total count of patients in each ward?' and
    'What percentage of total capacity is being used in the Lodwar facility?'
  cube_query:
    measures:
    - rpt_lodwar_ward_utilisation.count
    - rpt_lodwar_ward_utilisation.pct_of_total
    dimensions:
    - rpt_lodwar_ward_utilisation.facility
    - rpt_lodwar_ward_utilisation.source_schema
    - rpt_lodwar_ward_utilisation.ward_name
    timeDimensions: []
    filters: []
    limit: 500
- id: procedure_revenue_metrics
  name: Procedure Revenue Metrics
  description: This metric tracks the total count of procedures and the average item amount
    billed across different facilities and insurers. Use this metric to analyze revenue trends
    over time, compare performance by facility, or assess the impact of different payment
    modes. Example questions include 'What is the average revenue per procedure for each facility
    this month?' or 'How does the procedure count vary by insurer?'
  cube_query:
    measures:
    - rpt_procedure_revenue.count
    - rpt_procedure_revenue.avg_item_amount
    dimensions:
    - rpt_procedure_revenue.facility
    - rpt_procedure_revenue.insurer
    - rpt_procedure_revenue.payment_mode
    - rpt_procedure_revenue.revenue_category
    timeDimensions:
    - dimension: rpt_procedure_revenue.revenue_month
      granularity: month
    filters: []
    limit: 500
- id: readmission_metrics
  name: Readmission Metrics
  description: This metric tracks the total number of readmissions and the approximate count
    of readmissions within 30 days of discharge. Use this data to analyze patient outcomes,
    evaluate discharge processes, and identify trends in readmission rates. It can help answer
    questions like 'What is the readmission rate by facility or discharge type?' and 'How
    do payment modes affect readmission counts?'
  cube_query:
    measures:
    - rpt_readmissions.count
    - rpt_readmissions.approx_gap_30day_count
    dimensions:
    - rpt_readmissions.discharge_type
    - rpt_readmissions.facility
    - rpt_readmissions.payment_mode
    - rpt_readmissions.ward_category
    timeDimensions:
    - dimension: rpt_readmissions.admission_month
      granularity: month
    filters: []
    limit: 500
- id: rpt_redistribution_metrics
  name: Redistribution Metrics
  description: This metric tracks the count of redistribution events and the suggested transfer
    quantities between facilities. Use this to analyze how resources are being allocated,
    identify deficits and surpluses, and assess clinical priorities. Example questions include
    'How many redistribution events occurred last month?' and 'What is the suggested transfer
    quantity for a specific therapeutic class?'
  cube_query:
    measures:
    - rpt_redistribution.count
    - rpt_redistribution.suggested_transfer_qty
    dimensions:
    - rpt_redistribution.canonical_name
    - rpt_redistribution.clinical_priority
    - rpt_redistribution.deficit_facility
    - rpt_redistribution.inn_name
    - rpt_redistribution.surplus_facility
    - rpt_redistribution.therapeutic_class
    - rpt_redistribution.therapeutic_subclass
    timeDimensions:
    - dimension: rpt_redistribution.deficit_data_as_of
      granularity: month
    filters: []
    limit: 500
- id: specialty_admissions_count
  name: Specialty Admissions Count
  description: This metric measures the total number of specialty admissions within the hospital
    system. It can be used to analyze trends in admissions over time, assess the performance
    of different facilities, and evaluate the impact of payment modes. Example questions include
    'How many specialty admissions occurred last month?' or 'What is the breakdown of admissions
    by facility?'
  cube_query:
    measures:
    - rpt_specialty_admissions.count
    dimensions:
    - rpt_specialty_admissions.facility
    - rpt_specialty_admissions.payment_mode
    - rpt_specialty_admissions.ward_name
    timeDimensions:
    - dimension: rpt_specialty_admissions.admission_month
      granularity: month
    filters: []
    limit: 500
- id: rpt_stock_status_count
  name: Total Stock Status Count
  description: This metric measures the total count of stock statuses across various facilities
    and product categories. Use it to analyze inventory levels, identify trends in stock availability,
    and assess the performance of different therapeutic classes. Example questions include
    'What is the total stock status count for a specific facility?' or 'How does the stock
    status vary by product category?'
  cube_query:
    measures:
    - rpt_stock_status.count
    dimensions:
    - rpt_stock_status.facility
    - rpt_stock_status.product_category
    - rpt_stock_status.stock_status
    - rpt_stock_status.therapeutic_class
    timeDimensions:
    - dimension: rpt_stock_status.last_dispensed_at
      granularity: month
    filters: []
    limit: 500
- id: stockout_alerts_count
  name: Stockout Alerts Count
  description: This metric measures the total number of stockout alerts generated within the
    hospital system. It is useful for tracking medication availability issues and understanding
    their impact on patient care. Example questions include 'How many stockout alerts were
    generated last month?' or 'What facilities reported the highest number of stockout alerts?'.
    Consider filtering by facility or therapeutic class for more specific insights.
  cube_query:
    measures:
    - rpt_stockout_alerts.count
    dimensions:
    - rpt_stockout_alerts.facility
    - rpt_stockout_alerts.canonical_name
    - rpt_stockout_alerts.clinical_priority
    - rpt_stockout_alerts.product_name
    - rpt_stockout_alerts.therapeutic_class
    - rpt_stockout_alerts.therapeutic_subclass
    timeDimensions:
    - dimension: rpt_stockout_alerts.first_stockout_dispense
      granularity: month
    filters: []
    limit: 500
- id: theatre_utilization_count
  name: Theatre Utilization Count
  description: This metric measures the total count of theatre utilization sessions within
    a specified time frame. It can be used to analyze how effectively theatre resources are
    being used across different facilities and types. Example questions include 'How many
    sessions were booked in the main theatre last month?' or 'What is the utilization count
    for each booking status?'. Filters can be applied based on facility, theatre name, and
    booking status for more granular insights.
  cube_query:
    measures:
    - rpt_theatre_utilization.count
    dimensions:
    - rpt_theatre_utilization.booking_status
    - rpt_theatre_utilization.facility
    - rpt_theatre_utilization.theatre_name
    - rpt_theatre_utilization.theatre_type
    timeDimensions:
    - dimension: rpt_theatre_utilization.session_month
      granularity: month
    filters: []
    limit: 500
- id: upd_admissions_profile_metrics
  name: Admissions Profile Metrics
  description: This metric provides insights into the number of admissions and their associated
    costs within the hospital system. It can be used to analyze trends in admissions by type,
    payment mode, and patient demographics such as sex. Example questions include 'What is
    the total admission cost for open admissions this month?' and 'How many admissions were
    recorded by type in the last quarter?'
  cube_query:
    measures:
    - upd_admissions_profile.count
    - upd_admissions_profile.admission_cost
    dimensions:
    - upd_admissions_profile.admission_type
    - upd_admissions_profile.is_open_admission
    - upd_admissions_profile.payment_mode
    - upd_admissions_profile.sex
    timeDimensions:
    - dimension: upd_admissions_profile.admission_date
      granularity: month
    filters: []
    limit: 500
- id: inventory_profile_metrics
  name: Inventory Profile Metrics
  description: This metric provides insights into the inventory profile of drugs, measuring
    the total count of items and their lifetime drug cost. Use this metric to analyze drug
    availability and financial impact over time. Example questions include 'What is the total
    count of drugs dispensed this month?' and 'How much have we spent on drugs in the last
    quarter?'
  cube_query:
    measures:
    - upd_inventory_profile.count
    - upd_inventory_profile.lifetime_drug_cost
    dimensions:
    - upd_inventory_profile.source_schema
    timeDimensions:
    - dimension: upd_inventory_profile.first_dispensed_at
      granularity: month
    filters: []
    limit: 500
