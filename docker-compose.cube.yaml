name: dashboard-cube

services:
  cube:
    restart: always
    image: cubejs/cube
    container_name: cube-container
    ports:
      - "4000:4000"
      - "15432:15432"
    volumes:
      - ./:/cube/conf
      - ./rsa_key.p8:/cube/conf/rsa_key.p8:ro
      # Cube reads /cube/conf/cube.js: follows the platform warehouse switch
      # (Snowflake via the CUBEJS_DB_* env as before, or Databend through
      # the dashboard's SQL translator). See cube/cube.js.
      - ./cube/cube.js:/cube/conf/cube.js:ro
      
    env_file: .env
    networks:
      - dashboard-net

networks:
  dashboard-net:
    external: true
    name: dashboard-net
