cubes:
  - name: rpt_doctor_performance
    sql_table: "\"REPORTING\".\"RPT_DOCTOR_PERFORMANCE\""
    data_source: default

    joins: []

    dimensions:
      - name: username
        sql: "{CUBE}.\"USERNAME\""
        type: string

      - name: visit_month
        sql: "{CUBE}.\"VISIT_MONTH\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:00:01.225366+00:00
      - name: evaluations
        sql: '{CUBE}."EVALUATIONS"'
        type: sum
        title: Doctor Evaluations (count)
        drill_members: [visit_month, username]
      - name: admissions
        sql: '{CUBE}."ADMISSIONS"'
        type: sum
        title: Doctor Admissions (count)
      - name: conversion_rate_pct
        sql: '{CUBE}."CONVERSION_RATE_PCT"'
        type: avg
        format: percent
        title: Admission Conversion Rate (%, averaged)
        description: AVERAGE of a pre-computed per-row rate — not safe when grouping/filtering by username or month. Use conversion_rate_calc_pct instead.

      - name: conversion_rate_calc_pct
        sql: "{admissions} * 100.0 / NULLIF({evaluations}, 0)"
        type: number
        format: percent
        title: Admission Conversion Rate (%)
        description: TRUE admission conversion rate — admissions / evaluations — correct at any grouping. Use for "facility-wide admission conversion rate", "which doctor has the highest conversion rate", "doctors with over 100 evaluations but conversion rate below 5%" questions.
        drill_members: [visit_month, username]

      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

