cubes:
  - name: rpt_stockout_alerts
    sql_table: "\"REPORTING\".\"RPT_STOCKOUT_ALERTS\""
    data_source: default

    joins: []

    dimensions:
      - name: canonical_name
        sql: "{CUBE}.\"CANONICAL_NAME\""
        type: string

      - name: clinical_priority
        sql: "{CUBE}.\"CLINICAL_PRIORITY\""
        type: string

      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: inn_name
        sql: "{CUBE}.\"INN_NAME\""
        type: string

      - name: product_name
        sql: "{CUBE}.\"PRODUCT_NAME\""
        type: string

      - name: therapeutic_class
        sql: "{CUBE}.\"THERAPEUTIC_CLASS\""
        type: string

      - name: therapeutic_subclass
        sql: "{CUBE}.\"THERAPEUTIC_SUBCLASS\""
        type: string

      - name: first_stockout_dispense
        sql: "{CUBE}.\"FIRST_STOCKOUT_DISPENSE\""
        type: time

      - name: last_dispensed_at
        sql: "{CUBE}.\"LAST_DISPENSED_AT\""
        type: time

      - name: last_stockout_dispense
        sql: "{CUBE}.\"LAST_STOCKOUT_DISPENSE\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:03:48.043699+00:00
      - name: current_soh_raw
        sql: '{CUBE}."CURRENT_SOH_RAW"'
        type: sum
      - name: stockout_dispense_events
        sql: '{CUBE}."STOCKOUT_DISPENSE_EVENTS"'
        type: sum
      - name: units_dispensed_at_zero
        sql: '{CUBE}."UNITS_DISPENSED_AT_ZERO"'
        type: sum
      - name: days_in_stockout
        sql: '{CUBE}."DAYS_IN_STOCKOUT"'
        type: sum
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

