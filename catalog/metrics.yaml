  description: This metric measures the total number of orthopedic admissions within a specified
    time frame. It can be used to analyze trends in patient admissions, assess facility performance,
    and identify peak admission periods. Example questions include 'How many orthopedic admissions
    occurred last month?' or 'What is the admission count by facility for the last quarter?'
  cube_query:
    measures:
    - vw_rpt_ortho_admissions.count
    dimensions:
    - vw_rpt_ortho_admissions.facility
    - vw_rpt_ortho_admissions.gender
    - vw_rpt_ortho_admissions.bed_category
    - vw_rpt_ortho_admissions.discharge_category
    timeDimensions:
    - dimension: vw_rpt_ortho_admissions.admission_month
      granularity: month
    filters: []
    limit: 500
- id: ortho_busy_periods_total_visits
  name: Total Visits During Orthopedic Busy Periods
  description: This metric measures the total number of visits during identified busy periods
    in orthopedic care. It can be used to analyze patient flow and peak times, helping to
    answer questions like 'What are the busiest days for orthopedic visits?' or 'How many
    patients visit during peak hours?' Consider filtering by visit day name or peak slot status
    for more granular insights.
  cube_query:
    measures:
    - vw_rpt_ortho_busy_periods.total_visits
    - vw_rpt_ortho_busy_periods.avg_per_day
    - vw_rpt_ortho_busy_periods.count
    - vw_rpt_ortho_busy_periods.pct_of_total
    dimensions:
    - vw_rpt_ortho_busy_periods.is_peak_slot
    - vw_rpt_ortho_busy_periods.visit_day_name
    timeDimensions: []
    filters: []
    limit: 500
- id: ortho_conversion_metrics_vw_rpt_ortho_conversion
  name: Orthopedic Conversion Metrics
  description: This metric tracks various aspects of orthopedic patient conversions, including
    admission year, days from outpatient to admission, length of stay, and total patient count.
    Use this metric to analyze trends in orthopedic admissions, evaluate the efficiency of
    the conversion process, and assess patient flow. Example questions include 'How many orthopedic
    patients were admitted last year?' and 'What is the average length of stay for orthopedic
    admissions?'
  cube_query:
    measures:
    - vw_rpt_ortho_conversion.admission_year
    - vw_rpt_ortho_conversion.opd_to_admission_days
    - vw_rpt_ortho_conversion.los_days
    - vw_rpt_ortho_conversion.count
    dimensions:
    - vw_rpt_ortho_conversion.bed_category
    - vw_rpt_ortho_conversion.facility
    - vw_rpt_ortho_conversion.gender
    - vw_rpt_ortho_conversion.conversion_type
    - vw_rpt_ortho_conversion.discharge_category
    - vw_rpt_ortho_conversion.is_direct_admission
    timeDimensions:
    - dimension: vw_rpt_ortho_conversion.admission_month
      granularity: month
    filters: []
    limit: 500
