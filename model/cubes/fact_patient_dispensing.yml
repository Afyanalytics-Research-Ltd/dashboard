cubes:
  - name: fact_patient_dispensing
    sql_table: "\"REPORTING\".\"FACT_PATIENT_DISPENSING\""
    data_source: default

    joins: []

    dimensions:
      - name: sk_patient_id
        sql: "{CUBE}.\"SK_PATIENT_ID\""
        type: string

      - name: sk_visit_id
        sql: "{CUBE}.\"SK_VISIT_ID\""
        type: string

      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string

      - name: dispensing_month
        sql: "{CUBE}.\"DISPENSING_MONTH\""
        type: time

      - name: first_dispensed_at
        sql: "{CUBE}.\"FIRST_DISPENSED_AT\""
        type: time

      - name: last_dispensed_at
        sql: "{CUBE}.\"LAST_DISPENSED_AT\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T12:58:34.271288+00:00
      - name: distinct_products
        sql: '{CUBE}."DISTINCT_PRODUCTS"'
        type: sum
      - name: total_units_dispensed
        sql: '{CUBE}."TOTAL_UNITS_DISPENSED"'
        type: sum
      - name: has_antibiotic
        sql: '{CUBE}."HAS_ANTIBIOTIC"'
        type: sum
      - name: has_antimalarial
        sql: '{CUBE}."HAS_ANTIMALARIAL"'
        type: sum
      - name: has_arv
        sql: '{CUBE}."HAS_ARV"'
        type: sum
      - name: has_chronic_drug
        sql: '{CUBE}."HAS_CHRONIC_DRUG"'
        type: sum
        title: chronic
        description: this is a boolean record please treat it as so it comes as 0 or 1
      - name: has_opioid
        sql: '{CUBE}."HAS_OPIOID"'
        type: sum
      - name: has_obstetric_drug
        sql: '{CUBE}."HAS_OBSTETRIC_DRUG"'
        type: sum
      - name: has_reserve_antibiotic
        sql: '{CUBE}."HAS_RESERVE_ANTIBIOTIC"'
        type: sum
      - name: has_other_drug
        sql: '{CUBE}."HAS_OTHER_DRUG"'
        type: sum
      - name: dispensing_year
        sql: '{CUBE}."DISPENSING_YEAR"'
        type: sum
      - name: count
        type: count

      - name: drugs_dispensed_count
        sql: "{CUBE}.\"DRUGS_DISPENSED_COUNT\""
        type: sum

      - name: total_drug_cost
        sql: "{CUBE}.\"TOTAL_DRUG_COST\""
        type: sum

      - name: unclassified_drug_count
        sql: "{CUBE}.\"UNCLASSIFIED_DRUG_COUNT\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

