{% extends "base.html" %}

{% block title %}Delete {{ object.name }}{% endblock %}

{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-12 col-lg-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white fw-semibold">
                <i class="bi bi-exclamation-triangle me-2"></i>Confirm Deletion
            </div>
            <div class="card-body text-center py-4">
                <i class="bi bi-trash3 text-danger mb-3" style="font-size:48px;"></i>
                <h5 class="fw-semibold mb-2">Delete "{{ object.name }}"?</h5>
                <p class="text-muted mb-4">
                    This action is permanent and cannot be undone. The dashboard record will be removed from the database.
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{% url 'analytics:dashboard_list' %}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash3 me-1"></i>Yes, delete it
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
