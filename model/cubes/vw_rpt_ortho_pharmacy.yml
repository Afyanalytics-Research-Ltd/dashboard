cubes:
  - name: vw_rpt_ortho_pharmacy
    sql_table: "\"REPORTING\".\"VW_RPT_ORTHO_PHARMACY\""
    data_source: default

    joins:
      - name: vw_rpt_ortho_patient_journey
        sql: "{CUBE}.\"VISIT_ID\" = {vw_rpt_ortho_patient_journey}.\"VISIT_ID\""
        relationship: many_to_one

    dimensions:
      - name: composite_patient_id
        sql: "{CUBE}.\"COMPOSITE_PATIENT_ID\""
        type: string

      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: is_served
        sql: "{CUBE}.\"IS_SERVED\""
        type: boolean

      - name: item_class
        sql: "{CUBE}.\"ITEM_CLASS\""
        type: string

      - name: item_name
        sql: "{CUBE}.\"ITEM_NAME\""
        type: string
        primary_key: true

      - name: order_day_name
        sql: "{CUBE}.\"ORDER_DAY_NAME\""
        type: string

      - name: patient_id
        sql: "{CUBE}.\"PATIENT_ID\""
        type: string

      - name: source_system
        sql: "{CUBE}.\"SOURCE_SYSTEM\""
        type: string

      - name: tat_category
        sql: "{CUBE}.\"TAT_CATEGORY\""
        type: string

      - name: visit_id
        sql: "{CUBE}.\"VISIT_ID\""
        type: string
        primary_key: true

      - name: dispensed_stamp
        sql: "{CUBE}.\"DISPENSED_STAMP\""
        type: time

      - name: order_date
        sql: "{CUBE}.\"ORDER_DATE\""
        type: time
        primary_key: true

      - name: order_month
        sql: "{CUBE}.\"ORDER_MONTH\""
        type: time

      - name: request_stamp
        sql: "{CUBE}.\"REQUEST_STAMP\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:05:11.761947+00:00
      - name: order_year
        sql: '{CUBE}."ORDER_YEAR"'
        type: sum
      - name: order_hour
        sql: '{CUBE}."ORDER_HOUR"'
        type: sum
      - name: tat_mins
        sql: '{CUBE}."TAT_MINS"'
        type: sum
      - name: revenue_kes
        sql: '{CUBE}."REVENUE_KES"'
        type: sum
        drill_members: [order_date, facility, item_class, item_name]
      - name: count
        type: count
        drill_members: [order_date, facility, item_class, visit_id]

      - name: quantity
        sql: "{CUBE}.\"QUANTITY\""
        type: sum

      - name: unit_price
        sql: "{CUBE}.\"UNIT_PRICE\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

