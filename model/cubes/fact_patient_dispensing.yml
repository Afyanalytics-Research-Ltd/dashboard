cubes:
  - name: fact_patient_dispensing
    sql_table: "\"REPORTING\".\"FACT_PATIENT_DISPENSING\""
    data_source: default

    joins: []

    dimensions:
      - name: patient_id
        sql: "{CUBE}.\"PATIENT_ID\""
        type: number

      - name: sk_patient_id
        sql: "{CUBE}.\"SK_PATIENT_ID\""
        type: string

      - name: sk_visit_id
        sql: "{CUBE}.\"SK_VISIT_ID\""
        type: string

      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string

      - name: dispensing_month
        sql: "{CUBE}.\"DISPENSING_MONTH\""
        type: time

      - name: first_dispensed_at
        sql: "{CUBE}.\"FIRST_DISPENSED_AT\""
        type: time

      - name: last_dispensed_at
        sql: "{CUBE}.\"LAST_DISPENSED_AT\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T12:58:34.271288+00:00
      - name: distinct_products
        sql: '{CUBE}."DISTINCT_PRODUCTS"'
        type: sum
      - name: total_units_dispensed
        sql: '{CUBE}."TOTAL_UNITS_DISPENSED"'
        type: sum
      - name: has_antibiotic
        sql: '{CUBE}."HAS_ANTIBIOTIC"'
        type: sum
        title: Visits With Antibiotic (count)
        description: Count of patient visits that included an antibiotic — 0/1 flag per visit, summed.
      - name: has_antimalarial
        sql: '{CUBE}."HAS_ANTIMALARIAL"'
        type: sum
        title: Visits With Antimalarial (count)
        description: Count of patient visits that included an antimalarial — 0/1 flag per visit, summed.
      - name: has_arv
        sql: '{CUBE}."HAS_ARV"'
        type: sum
        title: Visits With ARV (count)
        description: Count of patient visits that included an antiretroviral (ARV) — 0/1 flag per visit, summed. For DISTINCT PATIENT counts, use distinct_patients via the count-distinct dimension patient_id instead.
      - name: has_chronic_drug
        sql: '{CUBE}."HAS_CHRONIC_DRUG"'
        type: sum
        title: Visits With Chronic Disease Drug (count)
        description: Count of patient visits that included a chronic-disease drug (e.g. cardiovascular, diabetes) — 0/1 flag per visit, summed.
      - name: has_opioid
        sql: '{CUBE}."HAS_OPIOID"'
        type: sum
        title: Visits With Opioid (count)
      - name: has_obstetric_drug
        sql: '{CUBE}."HAS_OBSTETRIC_DRUG"'
        type: sum
        title: Visits With Obstetric Drug (count)
      - name: has_reserve_antibiotic
        sql: '{CUBE}."HAS_RESERVE_ANTIBIOTIC"'
        type: sum
        title: Visits With Reserve Antibiotic (count)
        description: Count of patient visits that included a WHO "reserve" (last-line, AMR-sensitive) antibiotic — 0/1 flag per visit, summed. Use for antimicrobial-resistance (AMR) signal questions.
      - name: has_other_drug
        sql: '{CUBE}."HAS_OTHER_DRUG"'
        type: sum
      - name: dispensing_year
        sql: '{CUBE}."DISPENSING_YEAR"'
        type: sum
      - name: count
        type: count
        title: Patient Visits (count)
        description: Count of patient dispensing visits (one row per visit) — for a count of DISTINCT patients (not visits), use distinct_patients instead.

      - name: distinct_patients
        sql: "{CUBE}.\"PATIENT_ID\""
        type: count_distinct
        title: Distinct Patients (count)
        description: Count of distinct patients — use for "how many patients received X" / "distinct patients" questions, as opposed to a visit count.

      - name: drugs_dispensed_count
        sql: "{CUBE}.\"DRUGS_DISPENSED_COUNT\""
        type: sum
        title: Total Drugs Dispensed Across Visits (count)
        description: Sum of distinct-drug counts across visits — for a PER-VISIT average, use avg_drugs_per_visit instead.

      - name: avg_drugs_per_visit
        sql: "{CUBE}.\"DRUGS_DISPENSED_COUNT\""
        type: avg
        title: Average Drugs per Visit
        description: Average number of distinct drugs dispensed per visit — use for "average drugs per visit" / "visits with multiple therapeutic classes" questions.

      - name: total_drug_cost
        sql: "{CUBE}.\"TOTAL_DRUG_COST\""
        type: sum
        title: Total Drug Cost per Visit (KES)

      - name: unclassified_drug_count
        sql: "{CUBE}.\"UNCLASSIFIED_DRUG_COUNT\""
        type: sum
        title: Unclassified Drugs Dispensed (count)
        description: Count of dispensed drugs that could not be classified into a therapeutic class — a data-quality signal.

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

