cubes:
  - name: fact_patient_finance_events
    sql_table: "\"REPORTING\".\"FACT_PATIENT_FINANCE_EVENTS\""
    data_source: default

    # rpt_retention is the hospital-wide patient hub. Raw PATIENT_ID collides
    # across facilities, so the join must normalize source_schema first
    # (strip the "_CLEAN" suffix and uppercase) before matching patient_id —
    # a naive patient_id-only join was verified to overcount by ~14%.
    joins:
      - name: rpt_retention
        sql: "UPPER(REGEXP_REPLACE({CUBE}.\"SOURCE_SCHEMA\", '_CLEAN$', '')) = UPPER(REGEXP_REPLACE({rpt_retention}.\"SOURCE_SCHEMA\", '_CLEAN$', '')) AND {CUBE}.\"PATIENT_ID\" = {rpt_retention}.\"PATIENT_ID\""
        relationship: many_to_one

    dimensions:
      # This table has no true row-level id in Snowflake (raw event log, no
      # surrogate key) — Cube still requires a declared primary_key since it
      # now participates in a join, so this composite is a best-effort
      # approximation, not a verified-unique key like the joins elsewhere.
      - name: event_type
        sql: "{CUBE}.\"EVENT_TYPE\""
        type: string
        primary_key: true

      - name: invoice_no
        sql: "{CUBE}.\"INVOICE_NO\""
        type: string

      - name: patient_id
        sql: "{CUBE}.\"PATIENT_ID\""
        type: string
        primary_key: true

      - name: payment_mode
        sql: "{CUBE}.\"PAYMENT_MODE\""
        type: string
        primary_key: true

      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string
        primary_key: true

      - name: source_table
        sql: "{CUBE}.\"SOURCE_TABLE\""
        type: string
        primary_key: true

      - name: event_date
        sql: "{CUBE}.\"EVENT_DATE\""
        type: time

    measures:
      - name: count
        type: count
        drill_members: [event_date, source_schema, event_type, payment_mode, patient_id]

      - name: amount
        sql: "{CUBE}.\"AMOUNT\""
        type: sum
        drill_members: [event_date, source_schema, event_type, payment_mode, patient_id]

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

