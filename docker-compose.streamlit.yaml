# Requires docker-compose.yaml's postgres and redis services to be reachable
# on the shared dashboard-net network (bring them up first). Combining with
# `-f docker-compose.yaml -f docker-compose.streamlit.yaml up -d` still works
# too, but is no longer required just for reachability - dashboard-net is a
# fixed, literally-named network every stack in this repo joins regardless
# of which compose project started it, so `streamlit:8501` resolves fine
# whether this file is brought up standalone or combined.
name: dashboard-streamlit

services:
  streamlit:
    restart: always
    build: .
    container_name: streamlit-container
    expose:
      - "8501"
    ports:
      - "8501:8501"
    volumes:
      - ./:/usr/src/app
    env_file: .env
    working_dir: /usr/src/app
    command:
      - streamlit
      - run
      - analytics_app/dashboards/dynamic_file_loader.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --server.enableCORS=false
      - --server.enableXsrfProtection=false
    networks:
      - dashboard-net

networks:
  dashboard-net:
    external: true
    name: dashboard-net
