cubes:
  - name: rpt_theatre_utilization
    sql_table: "\"REPORTING\".\"RPT_THEATRE_UTILIZATION\""
    data_source: default

    joins: []

    dimensions:
      - name: booking_status
        sql: "{CUBE}.\"BOOKING_STATUS\""
        type: string

      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: theatre_name
        sql: "{CUBE}.\"THEATRE_NAME\""
        type: string

      - name: theatre_type
        sql: "{CUBE}.\"THEATRE_TYPE\""
        type: string

      - name: session_month
        sql: "{CUBE}.\"SESSION_MONTH\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:04:07.798807+00:00
      - name: total_sessions
        sql: '{CUBE}."TOTAL_SESSIONS"'
        type: sum
      - name: completed_sessions
        sql: '{CUBE}."COMPLETED_SESSIONS"'
        type: sum
      - name: completion_rate_pct
        sql: '{CUBE}."COMPLETION_RATE_PCT"'
        type: avg
        format: percent
        title: Theatre Completion Rate (%, averaged)
        description: AVERAGE of a pre-computed per-row rate — not safe when grouping/filtering by facility or month. Use completion_rate_calc_pct instead.

      - name: completion_rate_calc_pct
        sql: "{completed_sessions} * 100.0 / NULLIF({total_sessions}, 0)"
        type: number
        format: percent
        title: Theatre Completion Rate (%)
        description: TRUE theatre completion rate — completed_sessions / total_sessions — correct at any grouping. Use for "theatre completion rate in the most recent month" questions.
        drill_members: [session_month, facility, theatre_name, theatre_type]

      - name: emergency_sessions
        sql: '{CUBE}."EMERGENCY_SESSIONS"'
        type: sum
        title: Emergency Theatre Sessions (count)
      - name: elective_sessions
        sql: '{CUBE}."ELECTIVE_SESSIONS"'
        type: sum
        title: Elective Theatre Sessions (count)

      - name: emergency_pct
        sql: "{emergency_sessions} * 100.0 / NULLIF({total_sessions}, 0)"
        type: number
        format: percent
        title: Emergency Session Share (%)
        description: Percentage of theatre sessions that were emergency (vs elective) — emergency_sessions / total_sessions. Use for "what proportion of sessions are emergency vs elective" questions.
      - name: avg_duration_min
        sql: '{CUBE}."AVG_DURATION_MIN"'
        type: avg
      - name: total_duration_min
        sql: '{CUBE}."TOTAL_DURATION_MIN"'
        type: sum
      - name: total_duration_hrs
        sql: '{CUBE}."TOTAL_DURATION_HRS"'
        type: sum
      - name: sessions_with_invoice
        sql: '{CUBE}."SESSIONS_WITH_INVOICE"'
        type: sum
      - name: total_revenue
        sql: '{CUBE}."TOTAL_REVENUE"'
        type: sum
      - name: avg_revenue_per_session
        sql: '{CUBE}."AVG_REVENUE_PER_SESSION"'
        type: avg
        title: Average Theatre Session Revenue (KES)
        description: Average revenue per theatre session, by theatre name/facility — use for "which theatre has the highest average session revenue" questions.
      - name: distinct_insurers
        sql: '{CUBE}."DISTINCT_INSURERS"'
        type: sum
      - name: insured_revenue
        sql: '{CUBE}."INSURED_REVENUE"'
        type: sum
        title: Theatre Insured Revenue (KES)
        description: Insured revenue from THEATRE sessions specifically — not overall facility insured revenue. For "which insurer contributes the most insured revenue" across all procedures, use rpt_procedure_revenue's total_revenue broken down by insurer instead.
      - name: cash_revenue
        sql: '{CUBE}."CASH_REVENUE"'
        type: sum
      - name: count
        type: count
        drill_members: [session_month, facility, theatre_name, theatre_type]

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

