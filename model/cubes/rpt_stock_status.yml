cubes:
  - name: rpt_stock_status
    sql_table: "\"REPORTING\".\"RPT_STOCK_STATUS\""
    data_source: default

    joins: []

    dimensions:
      - name: canonical_name
        sql: "{CUBE}.\"CANONICAL_NAME\""
        type: string

      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: inn_name
        sql: "{CUBE}.\"INN_NAME\""
        type: string

      - name: product_category
        sql: "{CUBE}.\"PRODUCT_CATEGORY\""
        type: string

      - name: product_name
        sql: "{CUBE}.\"PRODUCT_NAME\""
        type: string

      - name: stock_status
        sql: "{CUBE}.\"STOCK_STATUS\""
        type: string

      - name: therapeutic_class
        sql: "{CUBE}.\"THERAPEUTIC_CLASS\""
        type: string

      - name: therapeutic_subclass
        sql: "{CUBE}.\"THERAPEUTIC_SUBCLASS\""
        type: string

      - name: last_dispensed_at
        sql: "{CUBE}.\"LAST_DISPENSED_AT\""
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

