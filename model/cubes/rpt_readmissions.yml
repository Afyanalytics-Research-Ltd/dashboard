cubes:
  - name: rpt_readmissions
    sql_table: "\"REPORTING\".\"RPT_READMISSIONS\""
    data_source: default

    joins: []

    dimensions:
      - name: discharge_type
        sql: "{CUBE}.\"DISCHARGE_TYPE\""
        type: string

      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: payment_mode
        sql: "{CUBE}.\"PAYMENT_MODE\""
        type: string

      - name: ward_category
        sql: "{CUBE}.\"WARD_CATEGORY\""
        type: string

      - name: admission_month
        sql: "{CUBE}.\"ADMISSION_MONTH\""
        type: time

    measures:
      - name: count
        type: count

      - name: approx_gap_30day_count
        sql: "{CUBE}.\"APPROX_GAP_30DAY_COUNT\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

