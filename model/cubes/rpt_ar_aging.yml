cubes:
  - name: rpt_ar_aging
    sql_table: "\"REPORTING\".\"RPT_AR_AGING\""
    data_source: default

    joins: []

    dimensions:
      - name: aging_bucket
        sql: "{CUBE}.\"AGING_BUCKET\""
        type: string

      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: insurer
        sql: "{CUBE}.\"INSURER\""
        type: string

      - name: facility_data_end
        sql: "{CUBE}.\"FACILITY_DATA_END\""
        type: time

      - name: invoice_month
        sql: "{CUBE}.\"INVOICE_MONTH\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T12:59:24.754781+00:00
      - name: invoices
        sql: '{CUBE}."INVOICES"'
        type: sum
      - name: distinct_visits
        sql: '{CUBE}."DISTINCT_VISITS"'
        type: sum
      - name: total_billed
        sql: '{CUBE}."TOTAL_BILLED"'
        type: sum
      - name: total_collected
        sql: '{CUBE}."TOTAL_COLLECTED"'
        type: sum
      - name: total_outstanding
        sql: '{CUBE}."TOTAL_OUTSTANDING"'
        type: sum
      - name: collection_rate_pct
        sql: '{CUBE}."COLLECTION_RATE_PCT"'
        type: avg
      - name: dispatched_invoices
        sql: '{CUBE}."DISPATCHED_INVOICES"'
        type: sum
      - name: dispatch_rate_pct
        sql: '{CUBE}."DISPATCH_RATE_PCT"'
        type: avg
      - name: avg_days_to_dispatch
        sql: '{CUBE}."AVG_DAYS_TO_DISPATCH"'
        type: avg
      - name: avg_days_to_collection
        sql: '{CUBE}."AVG_DAYS_TO_COLLECTION"'
        type: avg
      - name: avg_days_outstanding
        sql: '{CUBE}."AVG_DAYS_OUTSTANDING"'
        type: avg
      - name: overpaid_invoices
        sql: '{CUBE}."OVERPAID_INVOICES"'
        type: sum
      - name: overpayment_kes
        sql: '{CUBE}."OVERPAYMENT_KES"'
        type: sum
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

