cubes:
  - name: fact_inpatient_admissions
    sql_table: "\"REPORTING\".\"FACT_INPATIENT_ADMISSIONS\""
    data_source: default

    joins: []

    dimensions:
      - name: composite_patient_id
        sql: "{CUBE}.\"COMPOSITE_PATIENT_ID\""
        type: string

      - name: sex
        sql: "{CUBE}.\"SEX\""
        type: string

      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string

    measures:
      - name: count
        type: count

      - name: total_visits_count
        sql: "{CUBE}.\"TOTAL_VISITS_COUNT\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

