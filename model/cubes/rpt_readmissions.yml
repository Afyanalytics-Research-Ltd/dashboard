cubes:
  - name: rpt_readmissions
    sql_table: "\"REPORTING\".\"RPT_READMISSIONS\""
    data_source: default

    joins: []

    dimensions:
      - name: discharge_type
        sql: "{CUBE}.\"DISCHARGE_TYPE\""
        type: string

      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: payment_mode
        sql: "{CUBE}.\"PAYMENT_MODE\""
        type: string

      - name: ward_category
        sql: "{CUBE}.\"WARD_CATEGORY\""
        type: string

      - name: admission_month
        sql: "{CUBE}.\"ADMISSION_MONTH\""
        type: time

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:03:28.456273+00:00
      - name: total_admissions
        sql: '{CUBE}."TOTAL_ADMISSIONS"'
        type: sum
      - name: readmissions
        sql: '{CUBE}."READMISSIONS"'
        type: sum
      - name: readmission_rate_pct
        sql: '{CUBE}."READMISSION_RATE_PCT"'
        type: avg
      - name: readmissions_30day
        sql: '{CUBE}."READMISSIONS_30DAY"'
        type: sum
      - name: readmission_30day_rate_pct
        sql: '{CUBE}."READMISSION_30DAY_RATE_PCT"'
        type: avg
      - name: avg_days_between_admissions
        sql: '{CUBE}."AVG_DAYS_BETWEEN_ADMISSIONS"'
        type: avg
      - name: insured_30day_revenue_at_risk
        sql: '{CUBE}."INSURED_30DAY_REVENUE_AT_RISK"'
        type: sum
      - name: count
        type: count

      - name: approx_gap_30day_count
        sql: "{CUBE}.\"APPROX_GAP_30DAY_COUNT\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

