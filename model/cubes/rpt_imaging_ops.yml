cubes:
  - name: rpt_imaging_ops
    sql_table: "\"REPORTING\".\"RPT_IMAGING_OPS\""
    data_source: default

    joins: []

    dimensions:
      - name: facility
        sql: "{CUBE}.\"FACILITY\""
        type: string

      - name: modality
        sql: "{CUBE}.\"MODALITY\""
        type: string

      - name: revenue_month
        sql: "{CUBE}.\"REVENUE_MONTH\""
        type: time

    measures:
      - name: count
        type: count

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

