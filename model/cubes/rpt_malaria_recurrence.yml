cubes:
  - name: rpt_malaria_recurrence
    sql_table: "\"REPORTING\".\"RPT_MALARIA_RECURRENCE\""
    data_source: default

    joins: []

    dimensions:
      - name: recurrence_tier
        sql: "{CUBE}.\"RECURRENCE_TIER\""
        type: string

      - name: source_schema
        sql: "{CUBE}.\"SOURCE_SCHEMA\""
        type: string

      - name: zone_label
        sql: "{CUBE}.\"ZONE_LABEL\""
        type: string

    measures:
      # Added by sync_cube_schemas_from_snowflake on 2026-08-05T13:01:25.496883+00:00
      - name: tier_order
        sql: '{CUBE}."TIER_ORDER"'
        type: sum
      - name: zone_max_visits
        sql: '{CUBE}."ZONE_MAX_VISITS"'
        type: sum
      - name: pct_of_zone_patients
        sql: '{CUBE}."PCT_OF_ZONE_PATIENTS"'
        type: sum
      - name: recurrence_rate
        sql: '{CUBE}."RECURRENCE_RATE"'
        type: avg
      - name: count
        type: count

      - name: patient_count
        sql: "{CUBE}.\"PATIENT_COUNT\""
        type: sum

      - name: zone_patient_count
        sql: "{CUBE}.\"ZONE_PATIENT_COUNT\""
        type: sum

      - name: zone_recurrent_patient_count
        sql: "{CUBE}.\"ZONE_RECURRENT_PATIENT_COUNT\""
        type: sum

    pre_aggregations:
      # Pre-aggregation definitions go here.
      # Learn more in the documentation: https://cube.dev/docs/caching/pre-aggregations/getting-started

